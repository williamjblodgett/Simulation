<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returning to Wildgrid…</title>
    <script>
      var missingPath = location.pathname.replace(/^\/Simulation\/?/, "").split("/")[0];
      var route = missingPath === "archive" || missingPath === "history" ? missingPath : "map";
      location.replace("/Simulation/" + location.search + "#/" + route);
    </script>
  </head>
  <body></body>
</html>
