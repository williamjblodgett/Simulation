<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returning to Simulation…</title>
    <script>
      var missingPath = location.pathname.replace(/^\/Simulation\/?/, "").split("/")[0];
      var aliases = { "about": "about", "planet": "planet", "planet-history": "planet-history", "legacy": "legacy", "archive": "archive", "history": "history" };
      var route = aliases[missingPath] || "";
      location.replace("/Simulation/" + location.search + "#/" + route);
    </script>
  </head>
  <body></body>
</html>
