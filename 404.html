<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returning to Wildgrid…</title>
    <script>
      var missingPath = location.pathname.replace(/^\/Simulation\/?/, "").split("/")[0];
      var supported = ["history", "about", "legacy", "archive"];
      var route = supported.indexOf(missingPath) >= 0 ? missingPath : "map";
      location.replace("/Simulation/" + location.search + "#/" + route);
    </script>
  </head>
  <body></body>
</html>
